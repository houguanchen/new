                    const targetEl = document.getElementById(cb.dataset.target);
                    if (!targetEl) return;

                    // Toggle visibility based on checkbox state
                    targetEl.classList.toggle('hidden', !cb.checked);
                    // Remove previous highlights
                    targetEl.classList.remove('reward-highlight', 'cost-highlight');

                    if (cb.checked) {
                        const label = cb.parentElement.textContent.trim();
                        const header = cb.closest('div.space-y-2').previousElementSibling.textContent;

                        // Populate summary lists and apply highlights
                        if (header.includes('状态')) summary.State.push(label);
                        else if (header.includes('动作')) summary.Action.push(label);
                        else if (header.includes('奖励')) {
                            summary.Reward.push(label.replace('奖励：', '').trim());
                            targetEl.classList.add('reward-highlight');
                        }
                        else if (header.includes('成本')) {
                            summary.Cost.push(label.replace('约束：', '').trim());
                            targetEl.classList.add('cost-highlight');
                        }
                    }
                });

                // Render summary lists
                const renderList = (key) => {
                    const el = document.getElementById(`summary-${key}-ch7`);
                    if(el) el.innerHTML = summary[key].length ? summary[key].map(item => `<li>${item}</li>`).join('') : '<li>未选</li>';
                }
                ['State', 'Action', 'Reward', 'Cost'].forEach(renderList);
            }

            // Add event listeners
            checkboxes.forEach(cb => cb.addEventListener('change', updateUI));
            Object.values(controls).forEach(slider => { if(slider) slider.addEventListener('input', updateSimulation); });
            
            // Initial updates
            updateUI();
            updateSimulation();
        }

        // Chapter 8: Sim-to-Real Gap Visualization
        function initSimRealCanvas() {
            const canvas = document.getElementById('sim-real-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const slider = document.getElementById('model-quality-slider');
            const valueDisp = document.getElementById('model-quality-value');
            let quality = 50; // Initial model quality

            if (slider) slider.oninput = (e) => {
                quality = parseInt(e.target.value);
                if (valueDisp) valueDisp.textContent = quality;
            };

            let time = 0; // For animating the waves
            const draw = () => {
                // Stop animation if canvas element is no longer in DOM
                if(!document.getElementById('sim-real-canvas')) {
                    if(window.activeAnimationFrames.simReal) cancelAnimationFrame(window.activeAnimationFrames.simReal);
                    return;
                }

                const w = canvas.width, h = canvas.height;
                const isDark = document.documentElement.classList.contains('dark');
                ctx.clearRect(0, 0, w, h);
                time += 0.01; // Advance animation time

                // Draw "Real World" line (solid, dark)
                ctx.beginPath(); 
                ctx.strokeStyle = isDark ? '#f1f5f9' : '#1e293b'; 
                ctx.lineWidth = 3;
                for (let x = 0; x < w; x++) {
                    // Complex sine wave for "real world" signal
                    const y = h / 2 + Math.sin(x * 0.03 + time) * h / 6 + Math.cos(x * 0.07 + time) * h / 8;
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();

                // Draw "Simulated Model" line (dashed, blue)
                ctx.beginPath(); 
                ctx.strokeStyle = '#3b82f6'; 
                ctx.lineWidth = 2; 
                ctx.setLineDash([5, 5]); // Dashed line
                
                // Noise amplitude based on model quality (lower quality = more noise)
                const noise_amplitude = (100 - quality) / 100 * h / 3; 
                for (let x = 0; x < w; x++) {
                    const real_y = h / 2 + Math.sin(x * 0.03 + time) * h / 6 + Math.cos(x * 0.07 + time) * h / 8;
                    // Add random noise to simulate model inaccuracy
                    const sim_y = real_y + (Math.random() - 0.5) * noise_amplitude;
                    x === 0 ? ctx.moveTo(x, sim_y) : ctx.lineTo(x, sim_y);
                }
                ctx.stroke();
                ctx.setLineDash([]); // Reset line dash

                // Request next animation frame
                window.activeAnimationFrames.simReal = requestAnimationFrame(draw);
            };
            draw(); // Start the animation
        }

        // Chapter 9: RL Training Lab (Q-Learning Grid World)
        function initRlTrainingLab() {
            const canvas = document.getElementById('rl-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const chartCtx = document.getElementById('rewardChart')?.getContext('2d');
            if (!chartCtx) return; // Ensure chart canvas exists
            const startBtn = document.getElementById('start-sim');

            const GRID_SIZE = 8;
            const GOAL = { x: GRID_SIZE - 1, y: GRID_SIZE - 1 };
            const TRAPS = [{x: 2,y: 2},{x: 2,y: 3},{x: 3,y: 2},{x: 5,y: 5},{x: 6,y: 5}];
            let agent = { x: 0, y: 0, visualX: 0, visualY: 0 }; // Agent position and smooth visual position
            let q_table, episode, totalReward, rewardHistory, rewardChart, simParams, isTraining, isVisualizing;

            const sliders = { gamma: document.getElementById('gamma-slider'), lr: document.getElementById('lr-slider'), epsilon: document.getElementById('epsilon-slider-ch9') };
            const valueLabels = { gamma: document.getElementById('gamma-value'), lr: document.getElementById('lr-value'), epsilon: document.getElementById('epsilon-value-ch9') };
            
            // Reads slider values and updates display
            function setupParams() {
                simParams = { gamma: parseFloat(sliders.gamma.value), lr: parseFloat(sliders.lr.value), epsilon: parseFloat(sliders.epsilon.value) };
                valueLabels.gamma.textContent = simParams.gamma.toFixed(2);
                valueLabels.lr.textContent = simParams.lr.toFixed(2);
                valueLabels.epsilon.textContent = simParams.epsilon.toFixed(2);
            }

            // Resets the entire simulation state
            function resetSimulation() {
                // Clear any running intervals/animations
                if (window.rlSimulationIntervalId) clearInterval(window.rlSimulationIntervalId);
                if (window.rlAgentIntervalId) clearInterval(window.rlAgentIntervalId);
                if (state.activeAnimationFrames.agent) cancelAnimationFrame(state.activeAnimationFrames.agent);
                state.activeAnimationFrames.agent = null;
                
                isTraining = false;
                isVisualizing = false;
                
                // Adjust canvas size to fit container
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;

                // Initialize Q-table with zeros (State x Action space)
                q_table = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0).map(() => [0, 0, 0, 0])); // Actions: R, D, L, U
                episode = 0;
                totalReward = 0;
                rewardHistory = [];
                
                setupParams(); // Load initial parameters from sliders
                resetChart(); // Reset reward chart
                updateCounters(); // Update episode/reward display
                
                startBtn.disabled = false;
                startBtn.innerHTML = '开始训练';
                startBtn.onclick = startTraining; // Set button to start training

                agent = { x: 0, y: 0, visualX: 0, visualY: 0 }; // Reset agent position
                drawGrid(); // Initial grid draw
            }

            // Starts the training loop
            function startTraining() {
                if (isTraining) return;
                isTraining = true;
                startBtn.disabled = true;
                startBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 训练中...';
                // Run training episodes in batches for smoother UI
                window.rlSimulationIntervalId = setInterval(runTrainingBatch, 50); 
            }

            // Runs a batch of Q-learning episodes
            function runTrainingBatch() {
                if (episode >= 1000) { // Stop training after 1000 episodes
                    clearInterval(window.rlSimulationIntervalId); 
                    isTraining = false;
                    startBtn.innerHTML = '可视化最终策略';
                    startBtn.disabled = false;
                    startBtn.onclick = () => runAgentVisualization(true); // Change button to visualize
                    return; 
                }

                for(let i=0; i < 10; i++) { // Run 10 episodes per batch
                    let current_agent = { x: 0, y: 0 }; // Reset agent for each episode
                    let episodeReward = 0, done = false, steps = 0;
                    while (!done && steps < 50) { // Max 50 steps per episode
                        const state = { x: current_agent.x, y: current_agent.y };
                        const action = chooseAction(state, simParams.epsilon); // Epsilon-greedy action selection
                        const nextState = getNextState(state, action);
                        const reward = getReward(nextState);

                        // Q-learning update rule
                        const old_q = q_table[state.y][state.x][action];
                        const next_max_q = Math.max(...q_table[nextState.y][nextState.x]);
                        q_table[state.y][state.x][action] = old_q + simParams.lr * (reward + simParams.gamma * next_max_q - old_q);
                        
                        current_agent = nextState;
                        episodeReward += reward;
                        steps++;
                        done = isTerminal(nextState);
                    }
                    episode++;
                    rewardHistory.push(episodeReward);
                }
                
                updateChart(); // Update reward chart
                updateCounters(); // Update episode/reward display
                if (!isVisualizing) {
                    drawGrid(); // Redraw grid with updated Q-values
                }
            }

            // Runs a single agent visualization episode
            function runAgentVisualization(isFinalPolicy = false) {
                if (isVisualizing) return;
                isVisualizing = true;
                startBtn.disabled = true;

                agent = { x: 0, y: 0, visualX: 0, visualY: 0 }; // Reset agent position
                drawGrid(); // Initial draw with agent at start
                
                let steps = 0;
                window.rlAgentIntervalId = setInterval(() => {
                    if (isTerminal(agent) || steps > 50) { // Stop if terminal state reached or max steps
                        clearInterval(window.rlAgentIntervalId);
                        isVisualizing = false;
                        startBtn.disabled = false;
                        if(isFinalPolicy) startBtn.innerHTML = '重新可视化';
                        return;
                    }

                    // Choose action (greedy if visualizing final policy, else epsilon-greedy)
                    const action = chooseAction(agent, isFinalPolicy ? 0.0 : simParams.epsilon);
                    const nextState = getNextState(agent, action);
                    agent.x = nextState.x; // Update agent's true position
                    agent.y = nextState.y;
                    steps++;
                    
                    // Start smooth animation if not already running
                    if (!state.activeAnimationFrames.agent) {
                        animateAgentPosition();
                    }
                }, 300); // Agent moves every 300ms
            }

            // Smoothly animates agent's visual position
            function animateAgentPosition() {
                const dx = agent.x - agent.visualX;
                const dy = agent.y - agent.visualY;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist > 0.01) { // If not very close to target
                    agent.visualX += dx * 0.2; // Move 20% of the remaining distance
                    agent.visualY += dy * 0.2;
                    drawGrid(); // Redraw grid with new visual position
                    state.activeAnimationFrames.agent = requestAnimationFrame(animateAgentPosition);
                } else {
                    // Snap to exact position and stop animation
                    agent.visualX = agent.x;
                    agent.visualY = agent.y;
                    drawGrid();
                    state.activeAnimationFrames.agent = null;
                }
            }

            // Draws the grid, Q-value heatmap, and agent
            function drawGrid() {
                const cellSize = canvas.width / GRID_SIZE;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const isDark = document.documentElement.classList.contains('dark');

                // Normalize Q-values for heatmap coloring
                const all_q_values = q_table.flat(2).filter(q => !isNaN(q));
                const min_q = Math.min(...all_q_values, -1); // Ensure min/max are not zero if all Q-values are initially zero
                const max_q = Math.max(...all_q_values, 1);

                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        // Draw cell background
                        ctx.fillStyle = isDark ? '#334155' : '#f1f5f9'; // Default cell color
                        if(TRAPS.some(t => t.x === x && t.y === y)) ctx.fillStyle = isDark ? '#7f1d1d' : '#fee2e2'; // Trap color
                        if(GOAL.x === x && GOAL.y === y) ctx.fillStyle = isDark ? '#065f46' : '#dcfce7'; // Goal color
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);

                        // Draw Q-value triangles (if not terminal state)
                        if (!isTerminal({x,y})) {
                            const q_values = q_table[y][x]; // Q-values for actions: R, D, L, U
                            // Define coordinates for 4 triangles (representing 4 actions)
                            const triangleCoords = [
                                [[1, 0.5], [0.5, 0], [0.5, 1]],    // Right (0)
                                [[0.5, 1], [0, 0.5], [1, 0.5]],    // Down (1)
                                [[0, 0.5], [0.5, 0], [0.5, 1]],    // Left (2)
                                [[0.5, 0], [0, 0.5], [1, 0.5]],    // Up (3)
                            ];

                            for (let i = 0; i < 4; i++) {
                                // Color based on normalized Q-value (heatmap)
                                const heat = (q_values[i] - min_q) / (max_q - min_q) || 0;
                                const r = Math.floor(255 * (1 - heat));
                                const g = Math.floor(255 * heat);
                                ctx.fillStyle = `rgba(${r}, ${g}, 100, 0.7)`; // RGBA for transparency

                                ctx.beginPath();
                                const start = triangleCoords[i][0];
                                ctx.moveTo(x * cellSize + start[0] * cellSize, y * cellSize + start[1] * cellSize);
                                for (let j = 1; j < 3; j++) {
                                    const point = triangleCoords[i][j];
                                    ctx.lineTo(x * cellSize + point[0] * cellSize, y * cellSize + point[1] * cellSize);
                                }
                                ctx.closePath();
                                ctx.fill();
                            }
                        }
                        
                        // Draw cell borders
                        ctx.strokeStyle = isDark ? 'rgba(100, 116, 139, 0.5)' : '#e2e8f0';
                        ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }

                // Draw special symbols (Start, Goal, Traps)
                ctx.font = `${cellSize * 0.6}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', cellSize / 2, cellSize / 2); // Start
                ctx.fillText('🏆', GOAL.x * cellSize + cellSize / 2, GOAL.y * cellSize + cellSize / 2); // Goal
                TRAPS.forEach(t => ctx.fillText('☠️', t.x * cellSize + cellSize / 2, t.y * cellSize + cellSize / 2)); // Traps
                
                // Draw agent
                if(agent) {
                    const centerX = (agent.visualX + 0.5) * cellSize;
                    const centerY = (agent.visualY + 0.5) * cellSize;
                    const radius = cellSize * 0.35;
                    ctx.beginPath();
                    ctx.fillStyle = '#3b82f6'; // Agent color
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            }

            // Epsilon-greedy action selection
            function chooseAction(state, currentEpsilon) {
                if (Math.random() < currentEpsilon) {
                    return Math.floor(Math.random() * 4); // Random action (explore)
                }
                const q_vals = q_table[state.y][state.x];
                const max_q = Math.max(...q_vals);
                // Find all actions with max Q-value to break ties randomly
                const best_actions = q_vals.map((q,i) => q === max_q ? i : -1).filter(i => i !== -1);
                return best_actions[Math.floor(Math.random() * best_actions.length)]; // Greedy action (exploit)
            }

            // Determines next state given current state and action (simple grid movement)
            function getNextState({x,y}, action) {
                if (action === 0) x = Math.min(GRID_SIZE - 1, x + 1); // Right
                else if (action === 1) y = Math.min(GRID_SIZE - 1, y + 1); // Down
                else if (action === 2) x = Math.max(0, x - 1); // Left
                else if (action === 3) y = Math.max(0, y - 1); // Up
                return { x, y };
            }

            // Defines reward for each state
            function getReward(state) {
                if (state.x === GOAL.x && state.y === GOAL.y) return 100; // Goal reward
                if (TRAPS.some(t => t.x === state.x && t.y === state.y)) return -100; // Trap penalty
                return -1; // Step penalty
            }

            // Checks if a state is terminal (goal or trap)
            function isTerminal(state) { return (state.x === GOAL.x && state.y === GOAL.y) || TRAPS.some(t => t.x === state.x && t.y === state.y); }
            
            // Initializes the reward chart
            function resetChart() {
                if (rewardChart) rewardChart.destroy();
                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#94a3b8' : '#475569';
                const gridColor = isDark ? 'rgba(148, 163, 184, 0.2)' : 'rgba(0, 0, 0, 0.1)';
                window.rewardChart = new Chart(chartCtx, {
                    type: 'line',
                    data: { labels: [], datasets: [{ label: '最近50回合平均奖励', data: [], borderColor: '#16a34a', tension: 0.2, pointRadius: 0, fill: true, backgroundColor: 'rgba(22, 163, 74, 0.1)' }] },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        scales: { 
                            x: { display: false }, 
                            y: { title: { display: true, text: '奖励', color: textColor }, grid: { color: gridColor }, ticks: { color: textColor } } 
                        }, 
                        plugins: { legend: { display: false } } 
                    }
                });
            }

            // Updates the reward chart data
            function updateChart() {
                if (!rewardChart || episode % 20 !== 0) return; // Update every 20 episodes
                const recentRewards = rewardHistory.slice(-50); // Average over last 50 episodes
                totalReward = recentRewards.reduce((a, b) => a + b, 0) / recentRewards.length;
                rewardChart.data.labels.push(episode);
                rewardChart.data.datasets[0].data.push(totalReward);
                if (rewardChart.data.labels.length > 50) { // Keep only last 50 points
                    rewardChart.data.labels.shift();
                    rewardChart.data.datasets[0].data.shift();
                }
                rewardChart.update('none'); // 'none' for no animation on update
            }

            // Updates episode and reward counters
            function updateCounters() {
                document.getElementById('episode-counter').textContent = episode;
                document.getElementById('total-reward').textContent = totalReward.toFixed(2);
            }

            // Event listeners
            startBtn.addEventListener('click', resetSimulation); // Button starts/resets simulation
            Object.values(sliders).forEach(slider => slider.addEventListener('input', setupParams)); // Update params on slider change
            
            resetSimulation(); // Initial setup
        }

        // Chapter 1: Rankine Diagram SVG
        function renderRankineDiagram() {

        // Chapter 1: Dynamic Boiler Sandbox
        function initBoilerSandbox() {
            const sliders = {
                load: document.getElementById('load-slider'),
                air: document.getElementById('air-total-slider'),
                tilt: document.getElementById('burner-tilt-slider'),
                ofa: document.getElementById('o2-dist-slider')
            };
            if (!sliders.load) return; // Exit if sandbox elements are not found

            const values = {
                load: document.getElementById('load-value'),
                air: document.getElementById('air-total-value'),
                tilt: document.getElementById('burner-tilt-value'),
                ofa: document.getElementById('o2-dist-value')
            };
            const visuals = {
                flame: document.getElementById('flame-visual'),
                nox: document.getElementById('nox-meter-fill'),
                co: document.getElementById('co-meter-fill'),
                efficiency: document.getElementById('efficiency-value')
            };
            
            const paretoCtx = document.getElementById('pareto-chart')?.getContext('2d');
            let paretoChart;
            let workingPointHistory = []; // To store efficiency vs NOx points for the chart

            function updateBoilerSimulation() {
                // Get current slider values
                const load = parseFloat(sliders.load.value);
                const air = parseFloat(sliders.air.value);
                const tilt = parseFloat(sliders.tilt.value);
                const ofa = parseFloat(sliders.ofa.value);
                
                // Update displayed values
                values.load.textContent = load.toFixed(0);
                values.air.textContent = air.toFixed(0);
                values.tilt.textContent = tilt.toFixed(0);
                values.ofa.textContent = ofa.toFixed(0);

                // Simplified non-linear boiler model (illustrative)
                const load_factor = load / 100;
                let nox_raw = (air * 1.2 - ofa * 1.5 + Math.abs(tilt) * 0.8) * (0.8 + load_factor * 0.4);
                let co_raw = (150 - air + (Math.abs(air - 85) * 0.5)) * (0.9 + load_factor * 0.2);
                let eff_base = 90.5 + load_factor * 2;
                let eff_air = 1 - Math.abs(air - (80 + load_factor * 5)) / 50; // Optimal air changes with load
                let eff_ofa = 1 - Math.abs(ofa - 35) / 40; // Optimal OFA around 35%
                let efficiency_raw = eff_base + (eff_air * 1.5) + (eff_ofa * 1) - (co_raw / 150);

                // Clamp outputs to realistic ranges
                const nox = Math.max(10, Math.min(100, nox_raw));
                const co = Math.max(5, Math.min(100, co_raw));
                const efficiency = Math.max(88, Math.min(94.5, efficiency_raw));
                
                // --- Enhanced Flame Animation ---
                const flameHeight = (30 + (air / 100) * 80) * (0.7 + load_factor * 0.4);
                const flameSkew = tilt * -0.8;
                visuals.flame.style.height = `${flameHeight}%`;
                visuals.flame.style.transform = `translateY(${tilt * -2}px) skewX(${flameSkew}deg)`;
                // --- End Enhancement ---
                
                // Update visual meters and values
                visuals.nox.style.width = `${nox}%`;
                visuals.co.style.width = `${co}%`;
                visuals.efficiency.textContent = efficiency.toFixed(2);

                updateParetoChart(efficiency, nox); // Update the Pareto chart with current point
            }

            // Generates a simulated Pareto front for Efficiency vs NOx
            function generateParetoFront() {
                const front = [];
                for (let eff = 94.5; eff >= 90; eff -= 0.1) {
                    let nox = 30 + Math.pow(94.5 - eff, 2) * 2; // Non-linear relationship
                    nox += (Math.random() - 0.5) * 5; // Add some noise
                    front.push({x: nox, y: eff});
                }
                return front.sort((a,b) => a.x - b.x); // Sort by NOx for line drawing
            }

            // Updates the Pareto chart
            function updateParetoChart(efficiency, nox) {
                if (!paretoCtx) return;
                
                const newPoint = {x: nox, y: efficiency};
                workingPointHistory.push(newPoint);
                if (workingPointHistory.length > 20) workingPointHistory.shift(); // Keep last 20 points

                if (paretoChart) paretoChart.destroy(); // Destroy previous chart instance
                
                const isDark = document.documentElement.classList.contains('dark');
                const gridColor = isDark ? 'rgba(148, 163, 184, 0.2)' : 'rgba(0, 0, 0, 0.1)';
                const textColor = isDark ? '#94a3b8' : '#475569';

                window.paretoChart = new Chart(paretoCtx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: '帕累托最优前沿', data: generateParetoFront(), borderColor: 'rgba(220, 38, 38, 0.5)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, showLine: true, fill: false,
                        },{
                            label: '历史轨迹', data: workingPointHistory, backgroundColor: 'rgba(100, 116, 139, 0.3)', pointRadius: 3,
                        },{
                            label: '当前工作点', data: [newPoint], backgroundColor: 'rgb(79, 70, 229)', pointRadius: 8, pointHoverRadius: 10,
                        }]
                    },
                    options: {
                        animation: false, // Disable animation for real-time updates
                        scales: { 
                            x: { title: { display: true, text: 'NOx 排放', color: textColor }, min: 20, max: 100, grid: { color: gridColor }, ticks: { color: textColor } }, 
                            y: { title: { display: true, text: '热效率 (%)', color: textColor }, min: 88, max: 95, grid: { color: gridColor }, ticks: { color: textColor } } 
                        },
                        plugins: { legend: { position: 'bottom', labels: { color: textColor } } }
                    }
                });
            }

            // Add event listeners to all sliders
            Object.values(sliders).forEach(slider => slider.addEventListener('input', updateBoilerSimulation));
            updateBoilerSimulation(); // Initial simulation update
        }
