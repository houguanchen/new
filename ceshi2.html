<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能锅炉强化学习优化平台 (Pro v4)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        // MathJax configuration for LaTeX rendering
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* CSS Variables for Theming */
        :root {
            --bg-primary: #f8fafc; /* Light background */
            --bg-secondary: #ffffff; /* Card background */
            --bg-muted: #f1f5f9; /* Muted background for sections/inputs */
            --text-primary: #1e293b; /* Dark text */
            --text-secondary: #475569; /* Muted text */
            --border-color: #e2e8f0; /* Light border */
            --accent-color: #4f46e5; /* Indigo accent */
            --accent-text: #ffffff; /* White text on accent */
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
            --card-shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --glow-color: rgba(79, 70, 229, 0.2);
        }
        /* Dark Mode Overrides */
        .dark {
            --bg-primary: #0f172a; /* Dark background */
            --bg-secondary: #1e293b; /* Darker card background */
            --bg-muted: #334155; /* Dark muted background */
            --text-primary: #f1f5f9; /* Light text */
            --text-secondary: #94a3b8; /* Muted light text */
            --border-color: #334155; /* Dark border */
            --accent-color: #6366f1; /* Lighter indigo accent */
            --accent-text: #ffffff; /* White text on accent */
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --card-shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.2), 0 4px 6px -4px rgb(0 0 0 / 0.2);
            --glow-color: rgba(99, 102, 241, 0.3);
        }
        /* Base HTML and Body Styles */
        html { scroll-padding-top: 80px; }
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Animations & Transitions */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #content-container { animation: fadeIn 0.5s ease-out; }

        /* Navigation Styles */
        .dropdown-menu { display: none; animation: fadeIn 0.2s ease-out; }
        .dropdown.open .dropdown-menu { display: block; }
        .nav-link.active { font-weight: bold; color: var(--accent-color); background-color: rgba(79, 70, 229, 0.1); }
        .nav-link-completed::after {
            content: '✔'; color: #22c55e; font-weight: bold; margin-left: auto;
        }
        .nav-dropdown-btn.active {
            background-color: var(--bg-muted); color: var(--accent-color);
        }

        /* Component Base Styles */
        .card { 
            background-color: var(--bg-secondary); border-radius: 0.75rem; 
            box-shadow: var(--card-shadow); transition: all 0.3s ease-in-out; 
            border: 1px solid var(--border-color); 
        }
        .card:hover { 
            transform: translateY(-4px); box-shadow: var(--card-shadow-hover), 0 0 20px var(--glow-color); 
        }
        /* Heading Styles */
        h2 { 
            border-bottom: 2px solid var(--border-color); color: var(--text-primary); 
            font-size: 2.25rem; font-weight: 900; padding-bottom: 0.5rem; margin-bottom: 1.5rem;
        }
        h3 { 
            color: var(--text-primary); font-size: 1.5rem; font-weight: 700; 
            margin-top: 2rem; margin-bottom: 1rem;
        }
        h4 {
            color: var(--text-primary); font-size: 1.25rem; font-weight: 600; 
            margin-top: 1.5rem; margin-bottom: 0.75rem;
        }
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid var(--border-color); padding: 0.75rem; text-align: left; }
        th { background-color: var(--bg-muted); }
        
        /* Modal Specific Styles */
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 50; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-backdrop.visible { opacity: 1; pointer-events: auto; }
        .modal-content { background-color: var(--bg-secondary); padding: 2rem; border-radius: 0.75rem; max-width: 90%; width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transform: scale(0.95); transition: transform 0.3s ease; }
        .modal-backdrop.visible .modal-content { transform: scale(1); }

        /* Boiler Visuals */
        .flame-visual { position: absolute; bottom: 0; left: 50%; transform-origin: bottom center; width: 60%; margin-left: -30%; background: linear-gradient(to top, #ffde00, #ff8c00, rgba(255,140,0,0)); border-radius: 50% 50% 10% 10% / 100% 100% 20% 20%; transition: all 0.4s ease-in-out; animation: flicker-animation 0.3s infinite alternate; }
        #boiler-visual-container, #boiler-visual-container-ch7 { box-shadow: inset 0 0 15px rgba(0,0,0,0.5); border: 3px solid #475569; }
        @keyframes flicker-animation { 
            0% { transform: scaleY(1) skewX(0deg); opacity: 0.9; filter: brightness(1); } 
            50% { transform: scaleY(0.95) skewX(3deg); opacity: 1; filter: brightness(1.1); } 
            100% { transform: scaleY(1.05) skewX(-3deg); opacity: 0.95; filter: brightness(1.2); } 
        }
        /* Deployment Steps */
        .deployment-step { transition: all 0.3s ease; border-left-width: 4px; border-color: transparent; }
        .deployment-step.active { border-color: var(--accent-color); background-color: rgba(79, 70, 229, 0.1); }
        /* Code Blocks */
        pre { background-color: var(--bg-muted); padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.9em; color: var(--text-primary); position: relative; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background-color: var(--border-color); color: var(--text-secondary); border: none; padding: 0.25rem 0.5rem; border-radius: 0.25rem; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; }
        pre:hover .copy-btn { opacity: 1; }
        /* Preview Components (for CMDP Lab) */
        .preview-component.hidden { display: none; }
        .preview-component.reward-highlight { background-color: rgba(34, 197, 94, 0.1); border-left: 4px solid #22c55e; padding-left: 8px;}
        .preview-component.cost-highlight { background-color: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; padding-left: 8px; }
        /* Sliders */
        .slider::-webkit-slider-thumb { background: var(--accent-color); box-shadow: 0 0 0 3px var(--bg-secondary), 0 0 0 4px var(--accent-color); }
        /* Back to Top Button */
        #back-to-top { transition: opacity 0.3s, transform 0.3s; }
        /* Tab Buttons */
        .tab-btn { transition: all 0.2s ease-in-out; }
        .tab-btn.active { background-color: var(--accent-color); color: var(--accent-text); }

        /* Landing page background animation */
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        .animated-gradient {
            background: linear-gradient(270deg, #f3e8ff, #e0e7ff, #f0f9ff);
            background-size: 600% 600%;
            animation: gradient-animation 16s ease infinite;
        }
        .dark .animated-gradient {
            background: linear-gradient(270deg, #1e1b4b, #1e293b, #0c4a6e);
            background-size: 600% 600%;
            animation: gradient-animation 16s ease infinite;
        }
    </style>
</head>
<body>
    <!-- Revamped Landing Page -->
    <section id="home-landing" class="min-h-screen flex flex-col justify-center items-center p-4 animated-gradient">
        <div class="max-w-4xl text-center">
            <h1 class="text-5xl md:text-7xl font-extrabold text-indigo-700 dark:text-indigo-400 mb-6" style="animation: fadeInUp 0.8s ease-out both;">
                智能锅炉强化学习优化平台
            </h1>
            <p class="text-lg text-slate-600 dark:text-slate-300 mb-10 max-w-3xl mx-auto" style="animation: fadeInUp 0.8s ease-out 0.2s both;">
                融合深度强化学习与工业机理，驱动传统能源的智能化变革。我们提供从理论学习、仿真实验到部署策略的全链路解决方案。
            </p>
            <button id="start-experience-btn" class="bg-indigo-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-indigo-700 hover:shadow-xl transform hover:-translate-y-1 transition-all text-xl" style="animation: fadeInUp 0.8s ease-out 0.4s both;">
                <i class="fa-solid fa-rocket mr-2"></i>开启学习之旅
            </button>
        </div>
        <div class="max-w-6xl mx-auto mt-20 grid md:grid-cols-3 gap-8 px-4" style="animation: fadeInUp 0.8s ease-out 0.6s both;">
            <div class="card p-6 text-left hover:-translate-y-2">
                <i class="fa-solid fa-book-open text-3xl text-indigo-500 mb-4"></i>
                <h3 class="text-xl font-bold mt-0 mb-2">系统化理论</h3>
                <p class="text-themed-secondary text-sm">从工业控制基础到前沿RL算法，层层递进，构建坚实的理论基础。</p>

            <div class="card p-6 text-left hover:-translate-y-2">

                <i class="fa-solid fa-cogs text-3xl text-indigo-500 mb-4"></i>
                <h3 class="text-xl font-bold mt-0 mb-2">工程化实践</h3>
                <p class="text-themed-secondary text-sm">学习从数字孪生到三阶段安全部署的完整工业落地流程。</p>

        <footer class="text-center text-slate-500 dark:text-slate-400 text-sm py-6 w-full absolute bottom-0 border-t border-slate-200 dark:border-slate-700">

            <i class="fa-solid fa-eye"></i> 访问量: <span id="visitor-count">加载中...</span>

    <!-- Main App Interface -->
    <div id="main-app" class="hidden">
        <header class="bg-themed-secondary/80 dark:bg-themed-secondary/80 backdrop-blur-sm sticky top-0 z-40 w-full border-b border-themed">
            <div class="container mx-auto flex items-center justify-between p-4">
                <div class="flex items-center gap-3 cursor-pointer" id="main-logo">
                    <img src="https://placehold.co/64x64/ffffff/4f46e5?text=SEU" alt="东南大学logo" class="h-10 w-10 rounded-full bg-white p-0.5" onerror="this.onerror=null;this.src='https://placehold.co/64x64/ffffff/000000?text=SEU';" />
                    <h1 class="text-xl font-bold text-indigo-500 dark:text-indigo-400 hidden sm:block">RL锅炉优化平台</h1>
                </div>
                <div class="relative hidden md:block" id="search-container">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-themed-secondary"></i>
                    <input type="text" id="search-input" placeholder="搜索章节..." class="w-64 bg-themed-muted border border-themed rounded-lg py-1.5 pl-9 pr-4 focus:outline-none focus:ring-2 focus:ring-accent-color">
                    <div id="search-results" class="hidden absolute top-full left-0 mt-2 w-full bg-themed-secondary rounded-lg shadow-xl border border-themed p-2 z-50"></div>
                </div>
                <nav class="hidden md:flex items-center gap-2" id="desktop-nav"></nav>
                <div class="flex items-center gap-4">
                    <div id="auth-section"></div>
                    <button id="theme-toggle-btn" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-themed-muted transition-colors">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button id="mobile-menu-btn" class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg hover:bg-themed-muted transition-colors">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>
            </div>
            <div id="mobile-menu" class="hidden md:hidden border-t border-themed p-4"></div> <!-- Added mobile menu div -->
            <div id="global-progress-bar-container" class="w-full bg-themed-muted h-2.5">
                <div id="global-progress-bar" class="bg-green-500 h-2.5 transition-all duration-500" style="width: 0%"></div>
            </div>
        </header>
        
        <main class="container mx-auto p-4 md:p-8">
            <div id="breadcrumb" class="mb-4 text-sm text-themed-secondary"></div>
            <div id="content-container"></div>
        </main>
    </div>

    <!-- Modals -->
    <div id="auth-modal" class="modal-backdrop"></div>
    
    <!-- Back to Top Button -->
    <button id="back-to-top" class="fixed bottom-5 right-5 w-12 h-12 rounded-full bg-indigo-600 text-white shadow-lg flex items-center justify-center opacity-0 transform translate-y-4 pointer-events-none">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, runTransaction, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- App State ---
        const state = { currentUser: null, userProgress: [], currentView: '', activeAnimationFrames: {} };

        // --- Firebase Configuration and Initialization ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rl-boiler-app-pro';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        let app, auth, db;

        if (firebaseConfig) {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                setupAuthListener();
                incrementAndShowVisitorCount();
            } catch (e) { console.error("Firebase initialization failed:", e); }
        } else {
            console.warn("Firebase config not found. Some features like user progress and visitor count will be disabled.");
        }

        // --- Authentication & User Progress ---
        function setupAuthListener() {
            onAuthStateChanged(auth, async user => {
                if (user) {
                    state.currentUser = { uid: user.uid, email: user.email };
                    await fetchUserProgress(user.uid);
                } else {
                    state.currentUser = null;
                    state.userProgress = [];
                }
                renderAuthSection();
                renderNav();
                updateGlobalProgressBar();
            });
        }
        
        async function fetchUserProgress(userId) {
            if (!db) return;
            const progressRef = doc(db, `artifacts/${appId}/users/${userId}/progress`, 'main');
            const docSnap = await getDoc(progressRef);
            state.userProgress = docSnap.exists() ? docSnap.data().completedChapters || [] : [];
        }

        async function markChapterAsCompleted(chapterId) {
            if (!state.currentUser || state.userProgress.includes(chapterId) || !db) return;
            if (chapterId.startsWith('quiz')) return; // Do not mark quizzes as completed
            state.userProgress.push(chapterId);
            renderNav();
            updateGlobalProgressBar();
            const progressRef = doc(db, `artifacts/${appId}/users/${state.currentUser.uid}/progress`, 'main');
            try {
                await setDoc(progressRef, { completedChapters: arrayUnion(chapterId) }, { merge: true });
            } catch (error) { console.error("Error updating progress:", error); }
        }

        // --- Visitor Counter ---
        async function incrementAndShowVisitorCount() {
            const visitorCountEl = document.getElementById('visitor-count');
            if (!db) {
                if(visitorCountEl) visitorCountEl.textContent = 'N/A';
                return;
            }
            const counterRef = doc(db, `artifacts/${appId}/public/data/analytics`, 'page_views');
            try {
                await runTransaction(db, async (transaction) => {
                    const counterDoc = await transaction.get(counterRef);
                    const newCount = (counterDoc.data()?.count || 0) + 1;
                    transaction.set(counterRef, { count: newCount });
                });
                const finalDoc = await getDoc(counterRef);
                if (finalDoc.exists() && visitorCountEl) visitorCountEl.textContent = finalDoc.data().count;
            } catch (e) { 
                console.error("Failed to update visitor count:", e); 
                if(visitorCountEl) visitorCountEl.textContent = 'Error';
            }
        }

        // --- UI Element Selectors ---
        const contentContainer = document.getElementById('content-container');
        const desktopNav = document.getElementById('desktop-nav');
        const mobileMenu = document.getElementById('mobile-menu');
        const authSection = document.getElementById('auth-section');
        const authModalContainer = document.getElementById('auth-modal');
        const backToTopBtn = document.getElementById('back-to-top');
        const breadcrumb = document.getElementById('breadcrumb');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const globalProgressBar = document.getElementById('global-progress-bar');

        // --- Navigation Structure ---
        const navStructure = [
            { title: '基础篇', chapters: ['chapter1', 'chapter2'] },
            { title: '核心算法', chapters: ['chapter3', 'chapter4', 'chapter5', 'chapter6', 'quiz1'] },
            { title: '实践篇', chapters: ['chapter7', 'chapter8', 'chapter9'] },
            { title: '部署与未来', chapters: ['chapter10', 'chapter11', 'chapter12'] },
            { title: '关于', chapters: ['glossary', 'team', 'resources'] }
        ];
        const chapterDetails = {
            'chapter1': '锅炉原理与控制', 'chapter2': '强化学习世界观', 'chapter3': '深度学习与RL结合',
            'chapter4': '演员-评论家架构', 'chapter5': 'PPO算法详解', 'chapter6': 'SAC算法详解',
            'quiz1': '阶段小测 (核心算法)',
            'chapter7': 'CMDP构建实验室', 'chapter8': '构建数字孪生', 'chapter9': '训练实验与调试',
            'chapter10': '三阶段安全部署', 'chapter11': '总结与未来', 'chapter12': '高级主题-离线RL',
            'glossary': '关键术语表',
            'team': '团队介绍', 'resources': '关键资源'
        };

        const totalChaptersForProgress = navStructure.flatMap(g => g.chapters).filter(id => !id.startsWith('quiz')).length;

        // --- UI Rendering Functions ---
        function renderNav() {
            const navHtml = navStructure.map(group => `
                <div class="dropdown relative">
                    <button class="nav-dropdown-btn p-2 rounded-lg hover:bg-themed-muted transition-colors flex items-center gap-1" data-group="${group.title}">${group.title} <i class="fa-solid fa-chevron-down text-xs"></i></button>
                    <div class="dropdown-menu hidden absolute top-full left-0 mt-2 w-64 bg-themed-secondary rounded-lg shadow-xl border border-themed p-2 z-50">
                        ${group.chapters.map(id => `<a href="#${id}" data-view="${id}" class="nav-link flex items-center p-2 rounded-md text-sm ${state.userProgress.includes(id) ? 'nav-link-completed' : ''}">${chapterDetails[id]}</a>`).join('')}
                    </div>
                </div>`).join('');
            desktopNav.innerHTML = navHtml;
            mobileMenu.innerHTML = navStructure.flatMap(group => 
                [`<div class="px-2 py-1 text-sm font-semibold text-themed-secondary">${group.title}</div>`]
                .concat(group.chapters.map(id => `<a href="#${id}" data-view="${id}" class="nav-link block p-2 rounded-md text-sm ${state.userProgress.includes(id) ? 'nav-link-completed' : ''}">${chapterDetails[id]}</a>`))
            ).join('');
            updateNavActiveState();
        }

        function renderAuthSection() {
            authSection.innerHTML = state.currentUser ? `
                <div class="dropdown relative">
                    <button class="nav-dropdown-btn w-10 h-10 flex items-center justify-center rounded-full bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 font-semibold">
                        ${state.currentUser.email ? state.currentUser.email[0].toUpperCase() : 'A'}
                    </button>
                    <div class="dropdown-menu hidden absolute top-full right-0 mt-2 w-48 bg-themed-secondary rounded-lg shadow-xl border border-themed p-2 z-50">
                        <div class="px-2 py-1 text-xs text-themed-secondary truncate">${state.currentUser.email || '匿名用户'}</div>
                        <div class="my-1 border-t border-themed"></div>
                        <button id="logout-btn" class="w-full text-left p-2 rounded-md text-sm hover:bg-themed-muted">退出登录</button>
                    </div>
                </div>` : `
                <div class="flex items-center gap-2">
                    <button id="login-btn" class="px-3 py-1.5 text-sm rounded-lg hover:bg-themed-muted transition-colors">登录</button>
                    <button id="register-btn" class="px-3 py-1.5 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">注册</button>
                </div>`;
        }
        
        function showAuthModal(isLogin = true) {
            authModalContainer.innerHTML = `
                <div class="modal-content">
                    <h3 class="text-xl font-bold text-indigo-500 dark:text-indigo-400 mb-2">${isLogin ? '登录平台' : '创建账户'}</h3>
                    <p class="text-themed-secondary mb-6 text-sm">开始您的智能优化学习之旅。</p>
                    <div id="auth-error" class="hidden p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg dark:bg-red-200 dark:text-red-800"></div>
                    <form id="auth-form">
                        <div class="space-y-4">
                            <div><label for="auth-email" class="block text-sm font-medium text-themed-secondary">邮箱</label><input type="email" id="auth-email" required class="mt-1 block w-full bg-themed-muted border border-themed rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>

<div class="card p-6 mb-6">
    <h3>1.1 锅炉的基本工作原理与分类</h3>
    <p class="text-themed-secondary mb-4">锅炉是工业动力系统的心脏，其核心使命是高效、清洁地将燃料的化学能转化为蒸汽的热能。根据用途和结构，锅炉可分为多种类型。</p>

            </ul>

        <div class="p-4 bg-green-50 dark:bg-green-900/20 rounded-lg">
            <h4 class="font-bold text-green-700 dark:text-green-300 mb-2">按结构分类</h4>
            <ul class="text-sm space-y-1">
                <li><b>火管锅炉</b>：烟气在管内流动，水在管外</li>
                <li><b>水管锅炉</b>：水在管内流动，烟气在管外，现代主流</li>
                <li><b>直流锅炉</b>：水从给水泵直接变成过热蒸汽</li>

            </ul>
        </div>
    </div>

    <h4>现代大型电站锅炉的典型参数</h4>
    <table class="w-full text-sm mt-4 border-collapse">

<div class="card p-6 mb-6">
    <h3>1.2 燃烧理论与化学基础</h3>
    <p class="text-themed-secondary mb-4">燃烧是燃料与氧化剂发生的快速化学反应，伴随大量热量释放。理解燃烧的化学机理是优化锅炉运行的基础。</p>
    
    <h4>1.2.1 煤的组成与特性</h4>
    <p class="text-themed-secondary mb-4">煤是复杂的有机化合物混合体，其组成通常用工业分析和元素分析来表征：</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
            <h5 class="font-bold mb-2">工业分析 (Proximate Analysis)</h5>
            <ul class="text-sm space-y-1 text-themed-secondary">
                <li><b>水分 (M)</b>：影响燃烧热值和燃烧稳定性</li>
                <li><b>挥发分 (V)</b>：易燃组分，影响着火特性</li>
                <li><b>固定碳 (FC)</b>：主要可燃成分</li>
                <li><b>灰分 (A)</b>：不可燃矿物质，形成炉渣</li>
            </ul>
            <div class="mt-2 p-2 bg-themed-muted rounded text-center">
                $$M + V + FC + A = 100\%$$
            </div>
        </div>
        <div>
            <h5 class="font-bold mb-2">元素分析 (Ultimate Analysis)</h5>
            <ul class="text-sm space-y-1 text-themed-secondary">
                <li><b>碳 (C)</b>：主要发热元素，占60-80%</li>
                <li><b>氢 (H)</b>：发热量高，但含量少</li>
                <li><b>氧 (O)</b>：已部分氧化，降低发热量</li>
                <li><b>氮 (N)</b>：形成NOx的来源</li>
                <li><b>硫 (S)</b>：形成SOx，腐蚀设备</li>
            </ul>
        </div>
    </div>

    <h4>1.2.2 燃烧化学反应方程式</h4>
    <p class="text-themed-secondary mb-4">主要的燃烧反应包括：</p>
    <div class="space-y-3">
        <div class="p-4 bg-themed-muted rounded-lg">
            <h5 class="font-bold mb-2">碳的燃烧</h5>
            <div class="text-center space-y-1">
                <div>完全燃烧：$$C + O_2 \rightarrow CO_2 + 394 \text{ kJ/mol}$$</div>
                <div>不完全燃烧：$$2C + O_2 \rightarrow 2CO + 221 \text{ kJ/mol}$$</div>
            </div>
        </div>
        <div class="p-4 bg-themed-muted rounded-lg">
            <h5 class="font-bold mb-2">氢的燃烧</h5>
            <div class="text-center">
                $$2H_2 + O_2 \rightarrow 2H_2O + 484 \text{ kJ/mol}$$
            </div>
        </div>
        <div class="p-4 bg-themed-muted rounded-lg">
            <h5 class="font-bold mb-2">硫的燃烧</h5>
            <div class="text-center">
                $$S + O_2 \rightarrow SO_2 + 297 \text{ kJ/mol}$$
            </div>
        </div>
    </div>

    <h4>1.2.3 理论空气量与过量空气系数</h4>
    <p class="text-themed-secondary mb-4">燃烧计算的核心是确定理论空气量和实际空气量的关系。</p>
    
    <div class="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg mb-4">
        <h5 class="font-bold text-blue-700 dark:text-blue-300 mb-2">理论空气量计算</h5>
        <p class="text-sm mb-2">对于1kg燃料，理论空气量为：</p>
        <div class="text-center p-2 bg-white dark:bg-gray-800 rounded">
            $$V_0 = 0.089(C + 0.375S) + 0.265H - 0.033O \text{ m}^3/\text{kg}$$
        </div>
        <p class="text-xs mt-2 text-themed-secondary">其中C、H、S、O为元素分析中各元素的质量分数(%)</p>
    </div>

    <div class="p-4 bg-amber-50 dark:bg-amber-900/20 rounded-lg">
        <h5 class="font-bold text-amber-700 dark:text-amber-300 mb-2">过量空气系数</h5>
        <p class="text-sm mb-2">实际运行中需要过量空气确保完全燃烧：</p>
        <div class="text-center p-2 bg-white dark:bg-gray-800 rounded mb-2">
            $$\alpha = \frac{V_{\text{实际}}}{V_0}$$
        </div>
        <ul class="text-xs space-y-1">
            <li>α = 1.0：理想状态，实际不可能</li>
            <li>α = 1.15-1.25：煤粉炉典型值</li>
            <li>α > 1.3：过量过多，降低效率</li>
        </ul>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>1.3 传热理论与受热面设计</h3>
    <p class="text-themed-secondary mb-4">锅炉中的传热是一个复杂的多模式传热过程，包括辐射、对流和传导三种基本方式。</p>

    <h4>1.3.1 辐射传热</h4>
    <p class="text-themed-secondary mb-4">在炉膛内，高温火焰主要通过辐射方式向水冷壁传热，这是锅炉传热的主要形式。</p>
    
    <div class="p-4 bg-red-50 dark:bg-red-900/20 rounded-lg mb-4">
        <h5 class="font-bold text-red-700 dark:text-red-300 mb-2">Stefan-Boltzmann定律</h5>
        <div class="text-center p-2 bg-white dark:bg-gray-800 rounded mb-2">
            $$q = \sigma \varepsilon T^4$$
        </div>
        <p class="text-xs text-themed-secondary">其中：σ = 5.67×10⁻⁸ W/(m²·K⁴)，ε为发射率，T为绝对温度</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <h5 class="font-bold mb-2">炉膛辐射传热特点</h5>
            <ul class="text-sm space-y-1 text-themed-secondary">
                <li>传热量与温度四次方成正比</li>
                <li>不需要传热介质，直接传递</li>
                <li>在高温区(>800℃)占主导地位</li>
                <li>火焰位置直接影响传热分布</li>
            </ul>
        </div>
        <div>
            <h5 class="font-bold mb-2">影响因素</h5>
            <ul class="text-sm space-y-1 text-themed-secondary">
                <li><b>火焰温度</b>：空燃比、过量空气</li>
                <li><b>火焰几何</b>：燃烧器布置、摆角</li>
                <li><b>炉膛几何</b>：高度、宽度、深度</li>
                <li><b>受热面布置</b>：管排密度、管径</li>
            </ul>
        </div>
    </div>

    <h4>1.3.2 对流传热</h4>
    <p class="text-themed-secondary mb-4">在锅炉的后部受热面(过热器、再热器、省煤器)中，主要依靠高温烟气的对流传热。</p>
    
    <div class="p-4 bg-green-50 dark:bg-green-900/20 rounded-lg mb-4">
        <h5 class="font-bold text-green-700 dark:text-green-300 mb-2">Newton冷却定律</h5>
        <div class="text-center p-2 bg-white dark:bg-gray-800 rounded mb-2">
            $$q = h \cdot A \cdot \Delta T$$
        </div>
        <p class="text-xs text-themed-secondary">其中：h为对流传热系数，A为传热面积，ΔT为温差</p>
    </div>

    <div class="p-4 bg-purple-50 dark:bg-purple-900/20 rounded-lg">
        <h5 class="font-bold text-purple-700 dark:text-purple-300 mb-2">对流传热系数的影响因素</h5>
        <div class="text-center p-2 bg-white dark:bg-gray-800 rounded mb-2">
            $$Nu = C \cdot Re^n \cdot Pr^m$$
        </div>
        <p class="text-xs text-themed-secondary">Nusselt数与Reynolds数、Prandtl数的关系</p>
        <ul class="text-xs mt-2 space-y-1">
            <li>Re ↑ → 湍流增强 → h ↑</li>
            <li>烟气流速、密度、粘度都影响Re</li>
            <li>管径、管排布置影响流动特性</li>
        </ul>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>1.4 锅炉热力循环与热平衡</h3>
    
    <h4>1.4.1 Rankine循环详解</h4>
    <p class="text-themed-secondary mb-4">锅炉是Rankine循环的核心组件，负责将给水加热至过热蒸汽。理解热力循环对优化锅炉运行至关重要。</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center mt-6">
        <div id="boiler-diagram-container" class="p-2 bg-themed-secondary rounded-lg shadow-inner"></div>
        <div id="rankine-diagram-container" class="p-2 bg-themed-secondary rounded-lg shadow-inner"></div>
    </div>

    <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg">
        <h5 class="font-bold mb-2">Rankine循环四个过程</h5>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div>
                <b>1→2 (给水泵加压)</b>
                <ul class="ml-4 list-disc text-themed-secondary">
                    <li>等熵压缩过程</li>
                    <li>液体水被加压至锅炉压力</li>
                    <li>功耗较小(液体不可压缩)</li>
                </ul>
            </div>
            <div>
                <b>2→3 (锅炉加热)</b>
                <ul class="ml-4 list-disc text-themed-secondary">
                    <li>等压加热过程</li>
                    <li>预热→蒸发→过热三阶段</li>
                    <li>吸收燃料燃烧产生的热量</li>
                </ul>
            </div>
            <div>
                <b>3→4 (汽轮机做功)</b>
                <ul class="ml-4 list-disc text-themed-secondary">
                    <li>等熵膨胀过程</li>
                    <li>蒸汽推动叶轮做功</li>
                    <li>温度、压力下降</li>
                </ul>
            </div>
            <div>
                <b>4→1 (冷凝器冷却)</b>
                <ul class="ml-4 list-disc text-themed-secondary">
                    <li>等压冷凝过程</li>
                    <li>乏汽凝结成水</li>
                    <li>向冷却水放热</li>
                </ul>
            </div>
        </div>
    </div>

    <h4>1.4.2 锅炉热平衡分析</h4>
    <p class="text-themed-secondary mb-4">热平衡是评价锅炉运行经济性的重要指标，遵循能量守恒定律。</p>
    
    <div class="p-4 bg-themed-muted rounded-lg">
        <div class="text-center p-2 bg-white dark:bg-gray-800 rounded mb-4">
            $$Q_{输入} = Q_{有效利用} + \sum Q_{损失}$$
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <h5 class="font-bold text-green-600 dark:text-green-400 mb-2">热量输入</h5>
                <ul class="text-sm space-y-1">
                    <li>燃料低位发热量：$Q_1 = Q_{net,ar} \times B$</li>
                    <li>燃料物理显热(高温时)</li>
                    <li>空气物理显热(预热时)</li>
                </ul>
            </div>
            <div>
                <h5 class="font-bold text-red-600 dark:text-red-400 mb-2">热量损失</h5>
                <ul class="text-sm space-y-1">
                    <li>$q_2$：排烟热损失(最大，35-45%)</li>
                    <li>$q_3$：化学不完全燃烧损失</li>
                    <li>$q_4$：机械不完全燃烧损失</li>
                    <li>$q_5$：散热损失</li>
                    <li>$q_6$：灰渣物理热损失</li>
                </ul>
            </div>
        </div>
        
        <div class="mt-4 p-3 bg-blue-100 dark:bg-blue-900/30 rounded">
            <h5 class="font-bold text-blue-700 dark:text-blue-300 mb-1">锅炉效率计算</h5>
            <div class="text-center">
                $$\eta = \frac{Q_{有效利用}}{Q_{输入}} \times 100\% = (100 - \sum q_i)\%$$
            </div>
        </div>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>1.5 系统动态与建模</h3>
    <p class="text-themed-secondary mb-4">工业过程不是瞬时响应的。理解其动态特性是有效控制的前提。锅炉这类复杂系统的动态行为，通常可以被简化的一阶加纯迟滞(FOPDT)模型来近似描述。</p>
    <div class="p-4 my-2 bg-themed-muted rounded text-center text-md">
        $$G(s) = \frac{K_p e^{-\theta_p s}}{\tau_p s + 1}$$
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-center">
        <div>
            <h4>FOPDT模型参数物理意义</h4>
            <ul class="list-disc list-inside space-y-2 mt-2 text-themed-secondary">
                <li><b>$K_p$ (Process Gain) 过程增益:</b> 稳态下，输出变化量与输入变化量的比率。它表示系统的"敏感度"。例如：给煤量增加1%，主蒸汽温度最终升高多少℃。</li>
                <li><b>$\tau_p$ (Time Constant) 时间常数:</b> 系统达到新稳态63.2%所需的时间。它代表系统的"惯性"。大型锅炉的时间常数通常为15-60分钟。</li>
                <li><b>$\theta_p$ (Dead Time) 纯迟滞:</b> 从输入变化到输出开始响应的时间差。它代表系统的"延迟"。包括测量延迟、传输延迟、物理过程延迟等。</li>
            </ul>
            <p class="text-themed-secondary mt-4">例如，增大给煤量后，主蒸汽温度不会立刻上升，而是会延迟($\theta_p$)一会才开始缓慢爬升($\tau_p$)，最终达到一个新的、更高的稳定温度($K_p$)。</p>
            
            <div class="mt-4 p-3 bg-yellow-100 dark:bg-yellow-900/30 rounded">
                <h5 class="font-bold text-yellow-700 dark:text-yellow-300 mb-1">典型锅炉过程参数</h5>
                <table class="w-full text-xs">
                    <thead><tr><th>控制回路</th><th>$K_p$</th><th>$\tau_p$(min)</th><th>$\theta_p$(min)</th></tr></thead>
                    <tbody>
                        <tr><td>主蒸汽压力</td><td>0.8</td><td>15-25</td><td>2-5</td></tr>
                        <tr><td>主蒸汽温度</td><td>1.2</td><td>30-60</td><td>5-15</td></tr>
                        <tr><td>炉膛负压</td><td>-0.5</td><td>8-15</td><td>1-3</td></tr>
                        <tr><td>排烟温度</td><td>2.5</td><td>20-40</td><td>3-8</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="bg-themed-muted p-4 rounded-lg">
            <h4>FOPDT 模型浏览器</h4>
            <p class="text-sm text-themed-secondary mb-4">拖动滑块，观察不同动态参数如何影响系统的阶跃响应。理解这些参数对控制系统设计的影响。</p>
            <div>
                <label class="font-medium flex justify-between">增益 $K_p$: <span id="kp-value">1.0</span></label>
                <input type="range" id="kp-slider" min="0.2" max="2" step="0.1" value="1.0" class="slider w-full">
            </div>
            <div class="mt-2">
                <label class="font-medium flex justify-between">时间常数 $\tau_p$: <span id="tau-value">15</span>s</label>
                <input type="range" id="tau-slider" min="5" max="40" step="1" value="15" class="slider w-full">
            </div>
            <div class="mt-2">
                <label class="font-medium flex justify-between">纯迟滞 $\theta_p$: <span id="theta-value">10</span>s</label>
                <input type="range" id="theta-slider" min="0" max="30" step="1" value="10" class="slider w-full">
            </div>
            <div class="mt-3 text-xs text-themed-secondary">
                <p><b>观察要点：</b></p>
                <ul class="list-disc list-inside space-y-1">
                    <li>增益$K_p$影响最终稳态值</li>
                    <li>时间常数$\tau_p$影响响应快慢</li>
                    <li>纯迟滞$\theta_p$影响开始响应时间</li>
                </ul>
            </div>
        </div>
    </div>
    <div class="p-4 mt-4 bg-themed-muted rounded-lg">
        <canvas id="fopdt-chart"></canvas>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>1.6 工业基石：PID控制回路</h3>
    <p class="text-themed-secondary mb-4">在90%的工业场景中，PID（比例-积分-微分）控制器是维持系统稳定的中流砥柱。理解PID的原理和局限性，是理解为什么需要RL的关键。</p>
    
    <h4>1.6.1 PID控制原理深入解析</h4>
    <div class="p-4 bg-themed-muted rounded-lg mb-4">
        <div class="text-center p-2 bg-white dark:bg-gray-800 rounded mb-4">
            $$u(t) = K_p e(t) + K_i \int_0^t e(\tau) d\tau + K_d \frac{de(t)}{dt}$$
        </div>
        <p class="text-center text-sm text-themed-secondary">其中：$e(t) = r(t) - y(t)$ 为控制误差</p>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div>
            <h5 class="font-bold mb-3">PID三项作用详解</h5>
            <div class="space-y-4">
                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 rounded">
                    <h6 class="font-bold text-blue-700 dark:text-blue-300">比例项 (P)</h6>
                    <ul class="text-sm mt-1 space-y-1">
                        <li>与当前误差成正比：$u_p = K_p \cdot e(t)$</li>
                        <li>响应速度快，但存在稳态误差</li>
                        <li>$K_p$过大会引起振荡</li>
                        <li>$K_p$过小响应缓慢</li>
                    </ul>
                </div>
                <div class="p-3 bg-green-50 dark:bg-green-900/20 rounded">
                    <h6 class="font-bold text-green-700 dark:text-green-300">积分项 (I)</h6>
                    <ul class="text-sm mt-1 space-y-1">
                        <li>累积历史误差：$u_i = K_i \int e(t)dt$</li>
                        <li>消除稳态误差</li>
                        <li>$K_i$过大会导致积分饱和</li>
                        <li>积分时间$T_i = K_p/K_i$</li>
                    </ul>
                </div>
                <div class="p-3 bg-purple-50 dark:bg-purple-900/20 rounded">
                    <h6 class="font-bold text-purple-700 dark:text-purple-300">微分项 (D)</h6>
                    <ul class="text-sm mt-1 space-y-1">
                        <li>预测误差变化：$u_d = K_d \frac{de}{dt}$</li>
                        <li>抑制超调，改善动态性能</li>
                        <li>对噪声敏感</li>
                        <li>微分时间$T_d = K_d/K_p$</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="bg-themed-muted p-4 rounded-lg">
            <h4>PID参数调谐器</h4>
            <p class="text-sm text-themed-secondary mb-4">尝试调节P, I, D三个参数，观察系统对阶跃信号（如负荷突变）的响应曲线变化。</p>
            <div>
                <label for="p-gain" class="font-medium flex justify-between">比例 (P): <span id="p-gain-value">0.5</span></label>
                <input type="range" id="p-gain" min="0.1" max="2" step="0.1" value="0.5" class="slider w-full">
            </div>
            <div class="mt-4">
                <label for="i-gain" class="font-medium flex justify-between">积分 (I): <span id="i-gain-value">0.2</span></label>
                <input type="range" id="i-gain" min="0.05" max="1" step="0.05" value="0.2" class="slider w-full">
            </div>
            <div class="mt-4">
                <label for="d-gain" class="font-medium flex justify-between">微分 (D): <span id="d-gain-value">0.1</span></label>
                <input type="range" id="d-gain" min="0" max="1" step="0.05" value="0.1" class="slider w-full">
            </div>
            <div class="p-4 mt-4 bg-themed-muted rounded-lg">
                <canvas id="pid-chart"></canvas>
            </div>
            <div class="mt-4 p-3 bg-yellow-100 dark:bg-yellow-900/30 rounded">
                <h6 class="font-bold text-yellow-700 dark:text-yellow-300 mb-1">调谐经验法则</h6>
                <ul class="text-xs space-y-1">
                    <li><b>Ziegler-Nichols法</b>：先调P至临界振荡，再设置I、D</li>
                    <li><b>Cohen-Coon法</b>：适用于有纯迟滞的过程</li>
                    <li><b>ITAE最优法</b>：最小化时间乘误差积分</li>
                </ul>
            </div>
            <p class="mt-4 text-sm text-themed-secondary"><b>工程挑战:</b> PID参数在特定工况下调优后表现良好，但当工况（负荷、煤质、环境温度）变化时，固定的PID参数难以始终保持最优。这正是自适应控制和强化学习的用武之地。</p>
        </div>
    </div>
</div>

            'chapter2': `<h2>第2章: 强化学习世界观</h2>
<p class="text-lg text-themed-secondary mb-6">本章将为您构建一个完整的强化学习(RL)知识框架。我们将从其核心数学描述——马尔可夫决策过程(MDP)出发，深入探讨价值与策略的核心概念，并引出如何用更强大的序列模型来理解复杂的工业过程状态。</p>
<div class="card p-6 mb-6">
    <h3>2.1 马尔可夫决策过程 (MDP)</h3>
    <p class="text-themed-secondary mb-4">RL问题通常被数学化地描述为马尔可夫决策过程 (MDP)，一个由五元组构成的模型： $(S, A, P, R, \gamma)$。其核心假设是<b>马尔可夫性质</b>：未来只与现在有关，与过去无关。即 $P(s_{t+1}|s_t, a_t, s_{t-1}, a_{t-1}, ...) = P(s_{t+1}|s_t, a_t)$。</p>
    <ul class="list-disc list-inside space-y-2 text-themed-secondary bg-themed-muted p-4 rounded-lg">
        <li><b>S (State)</b>: 状态集合。锅炉在时刻 $t$ 的所有相关参数的集合 $s_t$。</li>
        <li><b>A (Action)</b>: 动作集合。智能体可以执行的操作 $a_t$，如调整总风量。</li>
        <li><b>P (Transition Probability)</b>: 状态转移概率 $P(s_{t+1}|s_t,a_t)$。描述了在状态 $s_t$ 执行动作 $a_t$ 后，转移到状态 $s_{t+1}$ 的概率。</li>
        <li><b>R (Reward Function)</b>: 奖励函数 $R(s_t,a_t,s_{t+1})$。执行动作后环境反馈的即时奖励 $r_t$。</li>
        <li><b>$\gamma$ (Discount Factor)</b>: 折扣因子，取值在[0, 1]之间，用于平衡短期奖励和长期奖励的重要性。</li>
    </ul>
</div>
<div class="card p-6 mb-6">
    <h3>2.2 核心概念：策略与价值的博弈</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <h4>策略 (Policy) $\pi$</h4>
            <p class="text-themed-secondary">策略是智能体的大脑，是其行为方式的完整描述。它是一个函数，将状态映射到动作。RL的目标就是找到一个最优策略 $\pi^*$，以最大化累积回报 $G_t = \sum_{k=0}^{\infty} \gamma^k r_{t+k}$。</p>
        </div>
        <div>
            <h4>价值函数 (Value Function)</h4>
            <p class="text-themed-secondary">价值函数用于评估一个策略有多好，它衡量了"身处某个状态"或"在某个状态下执行某个动作"的长期价值。
            <ul class="list-disc list-inside mt-2 text-sm">
                <li>状态价值 $V^\pi(s) = \mathbb{E}_\pi[G_t | s_t=s]$</li>
                <li>动作价值 $Q^\pi(s, a) = \mathbb{E}_\pi[G_t | s_t=s, a_t=a]$</li>
            </ul>
            $Q$函数通常更受关注，因为它直接告诉我们在一个状态下哪个动作更好。
            </p>
        </div>
    </div>
    <h4>贝尔曼最优方程</h4>
    <p class="text-themed-secondary">最优策略 $\pi^*$ 对应的价值函数 $V^*$ 和 $Q^*$ 满足一种特殊的自洽关系，即贝尔曼最优方程。它们是动态规划和许多RL算法的理论基石：</p>
    <div class="p-2 my-2 bg-themed-secondary rounded text-center text-md">
        $$V^*(s) = \max_a \mathbb{E}[r_{t+1} + \gamma V^*(s_{t+1}) | s_t=s, a_t=a]$$
    </div>
    <div class="p-2 my-2 bg-themed-secondary rounded text-center text-md">
        $$Q^*(s, a) = \mathbb{E}[r_{t+1} + \gamma \max_{a'} Q^*(s_{t+1}, a') | s_t=s, a_t=a]$$
    </div>
</div>
<div class="card p-6 mb-6">
    <h3>2.3 核心矛盾：On-Policy vs. Off-Policy</h3>
    <p class="text-themed-secondary mb-4">RL算法可以根据其使用数据的方式分为两大类：</p>
    <table class="min-w-full text-sm mt-4">
        <thead><tr><th>特性</th><th>On-Policy (同策略)</th><th>Off-Policy (异策略)</th></tr></thead>
        <tbody class="text-themed-secondary">
            <tr><td class="font-semibold">核心思想</td><td>学习的策略和用于收集数据的策略是同一个。边探索边学习。</td><td>使用一个行为策略收集数据，来更新另一个目标策略。</td></tr>
            <tr><td class="font-semibold">数据利用率</td><td>低。每次策略更新后，旧数据必须丢弃。</td><td>高。可以反复利用历史数据（经验回放）。</td></tr>
            <tr><td class="font-semibold">稳定性</td><td>通常更稳定，因为学习和探索是同步的。</td><td>可能不稳定，因为行为策略和目标策略的分布差异可能很大。</td></tr>
            <tr><td class="font-semibold">典型算法</td><td>Sarsa, PPO, A2C</td><td>Q-Learning, DQN, DDPG, SAC</td></tr>
        </tbody>
    </table>
</div>

<div class="card p-6 mb-6">
    <h3>2.4 现代方法：用序列模型理解工业过程</h3>
    <p class="text-themed-secondary mb-4">锅炉等工业过程具有强烈的<b>时序依赖性</b>和<b>惯性</b>。当前的状态不仅与上一秒的动作有关，还可能与几十分钟前的燃料变化有关。将状态简单地看作一个孤立的时间点快照($s_t$)会丢失大量信息。</p>
    <h4>从快照到历史：RNN 与 Transformer</h4>
    <p class="text-themed-secondary mb-4">为了让智能体拥有"记忆"，研究人员引入了序列模型来处理历史数据。传统上使用<b>循环神经网络 (RNN/LSTM)</b>，它们通过内部的循环结构逐步传递信息。然而，近年来功能更强大的<b>Transformer</b>模型已成为主流，其核心是<b>自注意力机制 (Self-Attention)</b>，能让模型在处理当前时刻数据时，"回顾"整个历史序列，并为所有过去的时间点动态地分配注意力权重，从而捕捉到对当前决策最关键的历史信息。</p>
    <h4>应用：基于Transformer的锅炉状态表征</h4>
    <p class="text-themed-secondary mb-4">我们可以构建一个更强大的、能理解过程历史的RL智能体，其工作流程如下：</p>
    <div id="transformer-boiler-diagram" class="p-4 bg-themed-muted rounded-lg flex justify-center"></div>
    <ol class="list-decimal list-inside space-y-2 text-themed-secondary mt-4">
        <li><b>数据准备：</b>从DCS中提取过去一段时间（如30分钟）的多变量时间序列数据，包括所有状态和动作。</li>
        <li><b>定义序列状态：</b>智能体观察到的"状态"不再是 $s_t$，而是历史序列 $(s_{t-k}, a_{t-k}, ..., s_{t-1}, a_{t-1}, s_t)$。</li>
        <li><b>编码与嵌入：</b>将序列中的每个元素（状态向量和动作向量）通过一个线性层映射为高维嵌入，并为其添加位置编码，以保留时序信息。</li>
        <li><b>Transformer编码器：</b>将嵌入序列送入Transformer编码器。其内部的自注意力层会计算序列中任意两个时间点之间的关联强度，生成一个对整个过程历史有深刻理解的上下文表示。</li>
        <li><b>决策输出：</b>将Transformer编码器的输出（代表了对当前状态的深度理解）送入两个小型的"决策头"网络，分别输出策略（下一个最优动作）和价值（当前状态的评分）。</li>
    </ol>
</div>
<div class="card p-6 mb-6">
    <h3>2.5 交互式动态规划求解器 (专业版)</h3>
    <p class="text-slate-600 dark:text-slate-300 mb-4">动态规划(DP)是解决已知模型MDP的基础方法。这个升级版的求解器将让您直观地看到每一次迭代中，价值函数是如何在网格中**逐格扫描**并更新的，从而揭示算法的内在工作机制。</p>
    <div class="flex flex-col md:flex-row gap-6 items-start">
        <div class="flex-shrink-0 relative">
            <canvas id="bellman-canvas" width="400" height="400" class="border rounded-lg bg-white dark:bg-slate-800 shadow-inner"></canvas>
        </div>
        <div class="flex-grow space-y-4">
            <div class="grid grid-cols-2 gap-2">
                <button id="iterate-bellman-btn" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors disabled:bg-indigo-400"><i class="fa-solid fa-shoe-prints"></i> 迭代一步</button>
                <button id="solve-bellman-btn" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition-colors disabled:bg-green-400"><i class="fa-solid fa-robot"></i> 自动求解</button>
            </div>
            <button id="reset-bellman-btn" class="w-full bg-slate-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-slate-600 transition-colors"><i class="fa-solid fa-arrow-rotate-left"></i> 重置</button>
            <div class="p-3 bg-themed-muted rounded-lg">
                <label for="dp-method-select" class="text-sm font-bold text-themed-secondary">选择算法:</label>
                <select id="dp-method-select" class="w-full p-2 rounded border-gray-300 dark:bg-slate-700 dark:border-slate-600 mt-1">
                    <option value="vi">价值迭代 (Value Iteration)</option>
                    <option value="pi">策略迭代 (Policy Iteration)</option>
                </select>
            </div>
            <div class="text-sm p-4 bg-slate-50 dark:bg-slate-800 rounded-lg">
                <p><strong>迭代次数:</strong> <span id="bellman-iteration-count">0</span></p>
                <p><strong>当前阶段:</strong> <span id="pi-phase-info">--</span></p>
                <p><strong>折扣因子 $\gamma$:</strong> 0.9</p>
                <div id="bellman-update-info" class="text-center font-mono h-20 mt-2 p-2 bg-slate-100 dark:bg-slate-700 rounded flex items-center justify-center text-xs">请开始迭代...</div>
            </div>
        </div>
    </div>
</div>`,
            'chapter3': `<h2>第3章: 深度学习与RL结合</h2>
<p class="text-lg text-themed-secondary mb-6">经典RL方法使用表格存储价值，但这在状态空间巨大时会面临"维度灾难"。深度学习通过使用神经网络(NN)作为强大的函数逼近器，催生了深度强化学习(DRL)，使其能应对拥有高维、连续状态空间的复杂问题，比如锅炉控制。</p>

<div class="card p-6 mb-6">
    <h3>3.1 神经网络：万能函数逼近器</h3>
    <p class="text-themed-secondary mb-4">神经网络是DRL的核心引擎。一个基本的前馈神经网络(Feed-Forward Neural Network)，或称多层感知机(MLP)，由输入层、若干隐藏层和输出层构成。</p>
    
    <h4>3.1.1 基础架构与数学原理</h4>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center mb-6">
        <div class="p-4 bg-themed-muted rounded-lg" id="nn-diagram-container"></div>
        <div>
            <h5 class="font-bold mb-2">前向传播过程</h5>
            <div class="p-3 bg-blue-50 dark:bg-blue-900/20 rounded mb-3">
                <div class="text-center text-sm">
                    $$z^{(l)} = W^{(l)} a^{(l-1)} + b^{(l)}$$
                    $$a^{(l)} = f(z^{(l)})$$
                </div>
                <p class="text-xs mt-2">其中$W^{(l)}$为第$l$层权重矩阵，$b^{(l)}$为偏置向量，$f(\cdot)$为激活函数</p>
            </div>
            <ul class="list-disc list-inside space-y-2 text-themed-secondary text-sm">
                <li><b>神经元:</b> 网络的基本计算单元，接收来自上一层的输入，进行加权求和，然后通过一个非线性的<b>激活函数</b>得到输出</li>
                <li><b>权重与偏置:</b> 可学习参数，通过训练不断调整以拟合目标函数</li>
                <li><b>激活函数:</b> 引入非线性，使网络能够学习复杂的非线性映射关系</li>
                <li><b>通用逼近定理:</b> 理论上证明了具有足够宽度的单隐层网络可以逼近任意连续函数</li>
            </ul>
        </div>
    </div>

    <h4>3.1.2 反向传播算法详解</h4>
    <p class="text-themed-secondary mb-4">反向传播是训练神经网络的核心算法，它通过链式法则计算损失函数对每个参数的梯度。</p>
    
    <div class="p-4 bg-themed-muted rounded-lg">
        <h5 class="font-bold mb-2">反向传播步骤</h5>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <b>1. 前向传播计算输出</b>
                <div class="text-sm mt-1 p-2 bg-white dark:bg-gray-800 rounded">
                    $$\hat{y} = f(x; \theta)$$
                </div>
                <b>2. 计算损失函数</b>
                <div class="text-sm mt-1 p-2 bg-white dark:bg-gray-800 rounded">
                    $$L = \frac{1}{n}\sum_{i=1}^n \ell(\hat{y}_i, y_i)$$
                </div>
            </div>
            <div>
                <b>3. 反向传播计算梯度</b>
                <div class="text-sm mt-1 p-2 bg-white dark:bg-gray-800 rounded">
                    $$\frac{\partial L}{\partial W^{(l)}} = \frac{\partial L}{\partial z^{(l)}} \cdot (a^{(l-1)})^T$$
                </div>
                <b>4. 更新参数</b>
                <div class="text-sm mt-1 p-2 bg-white dark:bg-gray-800 rounded">
                    $$\theta \leftarrow \theta - \eta \nabla_\theta L$$
                </div>
            </div>
        </div>
    </div>
</div>
<div class="card p-6 mb-6">
    <h3>3.2 激活函数动物园</h3>
    <p class="text-themed-secondary mb-4">选择合适的激活函数对神经网络的性能至关重要。不同的激活函数具有不同的特性和适用场景。</p>
    <div class="flex space-x-2 border-b border-themed mb-4">
        <button class="tab-btn px-4 py-2 rounded-t-lg" data-tab="relu">ReLU</button>
        <button class="tab-btn px-4 py-2 rounded-t-lg" data-tab="sigmoid">Sigmoid</button>
        <button class="tab-btn px-4 py-2 rounded-t-lg" data-tab="tanh">Tanh</button>
        <button class="tab-btn px-4 py-2 rounded-t-lg" data-tab="leaky">Leaky ReLU</button>
        <button class="tab-btn px-4 py-2 rounded-t-lg" data-tab="gelu">GELU</button>
    </div>
    <div id="activation-content" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <div class="p-4 bg-themed-muted rounded-lg">
            <canvas id="activation-chart" height="150"></canvas>
        </div>
        <div id="activation-desc" class="text-themed-secondary"></div>
    </div>
    
    <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg">
        <h5 class="font-bold mb-2">激活函数选择指南</h5>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
            <div>
                <b>隐藏层推荐</b>
                <ul class="mt-1 space-y-1 text-themed-secondary">
                    <li>ReLU: 通用首选</li>
                    <li>Leaky ReLU: 避免死神经元</li>
                    <li>GELU: Transformer中常用</li>
                </ul>
            </div>
            <div>
                <b>输出层选择</b>
                <ul class="mt-1 space-y-1 text-themed-secondary">
                    <li>线性: 回归问题</li>
                    <li>Sigmoid: 二分类</li>
                    <li>Softmax: 多分类</li>
                </ul>
            </div>
            <div>
                <b>特殊场景</b>
                <ul class="mt-1 space-y-1 text-themed-secondary">
                    <li>Tanh: 数据均值为0</li>
                    <li>Swish: 移动端优化</li>
                    <li>Mish: 精度要求高</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>3.3 现代神经网络架构</h3>
    <p class="text-themed-secondary mb-4">除了基础的全连接网络，现代深度学习发展出了多种专门化的网络架构，用于处理不同类型的数据和任务。</p>
    
    <h4>3.3.1 卷积神经网络 (CNN)</h4>
    <p class="text-themed-secondary mb-4">CNN专门用于处理具有网格结构的数据，如图像。在强化学习中，常用于处理像素状态输入。</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
            <h5 class="font-bold mb-2">核心组件</h5>
            <div class="space-y-3">
                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 rounded">
                    <h6 class="font-bold text-blue-700 dark:text-blue-300">卷积层</h6>
                    <p class="text-sm mt-1">通过可学习的滤波器(kernel)检测局部特征</p>
                    <div class="text-xs mt-1 p-1 bg-white dark:bg-gray-800 rounded">
                        $$(f * g)(m,n) = \sum_i \sum_j f(i,j)g(m-i,n-j)$$
                    </div>
                </div>
                <div class="p-3 bg-green-50 dark:bg-green-900/20 rounded">
                    <h6 class="font-bold text-green-700 dark:text-green-300">池化层</h6>
                    <p class="text-sm mt-1">降采样，减少参数量，增加平移不变性</p>
                </div>
                <div class="p-3 bg-purple-50 dark:bg-purple-900/20 rounded">
                    <h6 class="font-bold text-purple-700 dark:text-purple-300">全连接层</h6>
                    <p class="text-sm mt-1">最终的分类或回归层</p>
                </div>
            </div>
        </div>
        <div>
            <h5 class="font-bold mb-2">在RL中的应用</h5>
            <ul class="text-sm space-y-2 text-themed-secondary">
                <li><b>视觉RL:</b> 直接从像素学习策略，如Atari游戏</li>
                <li><b>工业图像:</b> 分析锅炉火焰图像判断燃烧状态</li>
                <li><b>特征提取:</b> 将高维视觉输入压缩为低维特征</li>
                <li><b>空间理解:</b> 理解环境的空间结构和关系</li>
            </ul>
            
            <div class="mt-4 p-3 bg-yellow-100 dark:bg-yellow-900/30 rounded">
                <h6 class="font-bold text-yellow-700 dark:text-yellow-300">典型CNN架构</h6>
                <p class="text-xs">Conv2D(32,3×3) → ReLU → MaxPool → Conv2D(64,3×3) → ReLU → MaxPool → FC(128) → FC(actions)</p>
            </div>
        </div>
    </div>

    <h4>3.3.2 循环神经网络 (RNN) 与LSTM</h4>
    <p class="text-themed-secondary mb-4">RNN系列网络专门处理序列数据，能够建模时间依赖关系，在处理具有记忆需求的RL任务中很有用。</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <h5 class="font-bold mb-2">LSTM单元结构</h5>
            <div class="p-3 bg-themed-muted rounded">
                <p class="text-sm mb-2">LSTM通过门控机制解决了传统RNN的梯度消失问题：</p>
                <ul class="text-xs space-y-1">
                    <li><b>遗忘门:</b> $f_t = \sigma(W_f \cdot [h_{t-1}, x_t] + b_f)$</li>
                    <li><b>输入门:</b> $i_t = \sigma(W_i \cdot [h_{t-1}, x_t] + b_i)$</li>
                    <li><b>输出门:</b> $o_t = \sigma(W_o \cdot [h_{t-1}, x_t] + b_o)$</li>
                    <li><b>细胞状态:</b> $C_t = f_t * C_{t-1} + i_t * \tilde{C}_t$</li>
                </ul>
            </div>
        </div>
        <div>
            <h5 class="font-bold mb-2">在RL中的应用</h5>
            <ul class="text-sm space-y-2 text-themed-secondary">
                <li><b>部分观测环境:</b> 维护对隐藏状态的信念</li>
                <li><b>策略记忆:</b> 记住过去的动作和观测</li>
                <li><b>时序决策:</b> 考虑动作的时间序列效应</li>
                <li><b>非马尔可夫过程:</b> 处理违反马尔可夫假设的环境</li>

            <div class="mt-4 p-3 bg-blue-100 dark:bg-blue-900/30 rounded">

                    <li><b>GRU:</b> 简化版LSTM，参数更少</li>
                    <li><b>Bi-LSTM:</b> 双向处理，适合序列分析</li>
                    <li><b>Attention-LSTM:</b> 结合注意力机制</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>3.4 注意力机制与Transformer</h3>
    <p class="text-themed-secondary mb-4">注意力机制是现代深度学习的重要突破，它允许模型动态地关注输入的不同部分，极大地提升了模型的表达能力。</p>
    
    <h4>3.4.1 自注意力机制原理</h4>
    <div class="p-4 bg-themed-muted rounded-lg mb-4">
        <h5 class="font-bold mb-2">数学原理</h5>
        <div class="text-center text-sm space-y-2">
            <div>$$\text{Attention}(Q,K,V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V$$</div>
            <div>$$\text{MultiHead}(Q,K,V) = \text{Concat}(\text{head}_1, ..., \text{head}_h)W^O$$</div>
        </div>
        <p class="text-xs mt-2 text-center text-themed-secondary">其中Q(查询)、K(键)、V(值)是通过线性变换得到的矩阵</p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <h5 class="font-bold mb-2">核心优势</h5>

                <li><b>长距离依赖:</b> 直接建模任意位置间的关系</li>
                <li><b>可解释性:</b> 注意力权重可以可视化</li>
                <li><b>灵活性:</b> 可以处理变长序列</li>
            </ul>
        </div>
        <div>
            <h5 class="font-bold mb-2">Transformer架构</h5>
            <ul class="text-sm space-y-2 text-themed-secondary">
                <li><b>编码器:</b> Self-Attention + FFN</li>
                <li><b>解码器:</b> Masked Self-Attention + Cross-Attention + FFN</li>
                <li><b>位置编码:</b> 提供序列位置信息</li>
                <li><b>残差连接:</b> 缓解梯度消失问题</li>
            </ul>
        </div>
    </div>

    <h4>3.4.2 在强化学习中的应用</h4>
    <div class="p-4 bg-green-50 dark:bg-green-900/20 rounded-lg">
        <h5 class="font-bold text-green-700 dark:text-green-300 mb-2">Decision Transformer</h5>
        <p class="text-sm mb-2">将RL问题重新定义为序列建模问题：</p>
        <ul class="text-xs space-y-1">
            <li>输入序列: (R₁, s₁, a₁, R₂, s₂, a₂, ...)</li>
            <li>目标: 预测下一个动作 aₜ</li>
            <li>优势: 可以直接利用离线数据，无需价值函数</li>
        </ul>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>3.5 正则化技术与优化策略</h3>
    <p class="text-themed-secondary mb-4">深度神经网络容易过拟合，需要各种正则化技术来提高泛化能力。同时，优化算法的选择也至关重要。</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <h5 class="font-bold mb-3">正则化技术</h5>
            <div class="space-y-3">
                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 rounded">
                    <h6 class="font-bold text-blue-700 dark:text-blue-300">Dropout</h6>
                    <p class="text-sm mt-1">训练时随机关闭部分神经元，强制网络不依赖特定神经元</p>
                    <div class="text-xs mt-1 font-mono">p_dropout = 0.1 ~ 0.5</div>
                </div>
                <div class="p-3 bg-green-50 dark:bg-green-900/20 rounded">
                    <h6 class="font-bold text-green-700 dark:text-green-300">Batch Normalization</h6>
                    <p class="text-sm mt-1">标准化每层的输入，加速训练并提高稳定性</p>
                    <div class="text-xs mt-1">$\hat{x} = \frac{x - \mu}{\sqrt{\sigma^2 + \epsilon}}$</div>
                </div>
                <div class="p-3 bg-purple-50 dark:bg-purple-900/20 rounded">
                    <h6 class="font-bold text-purple-700 dark:text-purple-300">权重衰减</h6>
                    <p class="text-sm mt-1">L2正则化，防止权重过大</p>
                    <div class="text-xs mt-1">$L = L_{data} + \lambda \sum_i w_i^2$</div>

        </div>
        <div>

                </div>
                <div class="p-3 bg-yellow-50 dark:bg-yellow-900/20 rounded">
                    <h6 class="font-bold text-yellow-700 dark:text-yellow-300">学习率调度</h6>
                    <p class="text-sm mt-1">动态调整学习率以获得更好的收敛</p>

            </div>
        </div>
    </div>
</div>

<div class="card p-6 mb-6">
    <h3>3.6 交互式理解：梯度下降与优化器</h3>
    <p class="text-themed-secondary mb-4">梯度下降是优化神经网络的核心算法。想象一下，我们想找到下图抛物线的最低点（最小损失）。我们从一个随机点开始，计算该点的"坡度"（梯度），然后沿着坡度最陡峭的反方向迈出一步。<b>学习率</b>决定了我们每一步迈多大。</p>

<div class="card p-6 mb-6">
    <h3>3.7 深度Q网络 (DQN)</h3>
    <p class="text-themed-secondary mb-4">DQN是DRL的开山之作，它首次成功地将深度学习与Q-Learning结合。DQN使用一个神经网络来逼近Q函数 $Q(s, a; \theta) \approx Q^*(s, a)$。为了解决训练不稳定的问题，它引入了两项关键技术：</p>
    
    <h4>3.7.1 核心算法流程</h4>
    <div class="p-4 bg-themed-muted rounded-lg mb-4">
        <h5 class="font-bold mb-2">DQN训练流程</h5>
        <ol class="text-sm space-y-2">
            <li><b>环境交互:</b> 使用ε-greedy策略选择动作，收集经验(s,a,r,s')</li>
            <li><b>经验存储:</b> 将经验存入回放缓冲区D</li>
            <li><b>批量采样:</b> 从D中随机采样小批量数据</li>
            <li><b>计算目标:</b> $y_i = r_i + \gamma \max_{a'} Q(s'_i, a'; \theta^-)$</li>
            <li><b>损失计算:</b> $L = \frac{1}{N}\sum_i (y_i - Q(s_i, a_i; \theta))^2$</li>
            <li><b>参数更新:</b> $\theta \leftarrow \theta - \alpha \nabla_\theta L$</li>
            <li><b>目标网络更新:</b> 定期更新$\theta^- \leftarrow \theta$</li>
        </ol>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
        <div class="p-4 bg-blue-500/10 rounded-lg">
            <h4 class="font-bold text-blue-600 dark:text-blue-400 mt-0">经验回放 (Experience Replay)</h4>
            <p class="text-sm mt-2">将智能体的经验元组 $(s_t, a_t, r_t, s_{t+1})$ 存入一个"回放池"。训练时，从池中随机采样一个小批量数据进行更新。这打破了数据的时间相关性，提高了数据利用效率。</p>
            <div class="mt-2 text-xs p-2 bg-white dark:bg-gray-800 rounded">
                缓冲区大小: 10⁴ ~ 10⁶ 条经验<br>
                批量大小: 32 ~ 256 个样本
            </div>
        </div>
        <div class="p-4 bg-green-500/10 rounded-lg">
            <h4 class="font-bold text-green-600 dark:text-green-400 mt-0">目标网络 (Target Network)</h4>
            <p class="text-sm mt-2">使用一个独立的、更新较慢的"目标网络"来计算TD目标值。这使得学习目标在一段时间内保持稳定，避免了模型"追逐自己尾巴"的问题，大幅提升了训练的稳定性。</p>
            <div class="mt-2 text-xs p-2 bg-white dark:bg-gray-800 rounded">
                更新频率: 每1000 ~ 10000步<br>
                软更新: $\theta^- \leftarrow \tau\theta + (1-\tau)\theta^-$
            </div>
        </div>
    </div>

    <h4>3.7.2 DQN的改进变种</h4>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
        <div>
            <h5 class="font-bold mb-2">Double DQN</h5>
            <p class="text-sm text-themed-secondary mb-2">解决Q值过估计问题</p>
            <div class="text-xs p-2 bg-themed-muted rounded">
                $y_i = r_i + \gamma Q(s'_i, \arg\max_{a'} Q(s'_i, a'; \theta); \theta^-)$
            </div>
        </div>
        <div>
            <h5 class="font-bold mb-2">Dueling DQN</h5>
            <p class="text-sm text-themed-secondary mb-2">分离状态价值和优势函数</p>
            <div class="text-xs p-2 bg-themed-muted rounded">
                $Q(s,a) = V(s) + A(s,a) - \frac{1}{|A|}\sum_{a'} A(s,a')$
            </div>
        </div>
        <div>
            <h5 class="font-bold mb-2">Prioritized Experience Replay</h5>
            <p class="text-sm text-themed-secondary mb-2">优先回放TD误差大的经验</p>
            <div class="text-xs p-2 bg-themed-muted rounded">
                $P(i) = \frac{p_i^\alpha}{\sum_k p_k^\alpha}$, $p_i = |TD_i| + \epsilon$
            </div>
        </div>
        <div>
            <h5 class="font-bold mb-2">Rainbow DQN</h5>
            <p class="text-sm text-themed-secondary mb-2">集成多种改进技术</p>
            <div class="text-xs p-2 bg-themed-muted rounded">
                Double + Dueling + Priority + Noisy + Categorical + N-step
            </div>
        </div>
    </div>
</div>

            'chapter4': `<h2>第4章: 演员-评论家架构</h2>

<div class="card p-6 mb-6">
